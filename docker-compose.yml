# ============================================
# Docker Compose — Local Development
# ============================================
# Usage:
#   docker compose up        — Start all services
#   docker compose up -d     — Start in background
#   docker compose down      — Stop and remove containers
#   docker compose down -v   — Stop and remove containers + volumes
#
# Services:
#   - mongodb: Database (port 27017)
#   - redis: Cache & job queue (port 6379)
#   - backend: Express API (port 5000)
#   - frontend: Vite dev server (port 3000)
#   - nginx: Reverse proxy (port 80)
# ============================================

services:
  # ------------------------------------------
  # MongoDB — Database
  # ------------------------------------------
  mongodb:
    image: mongo:7
    container_name: gurukul-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-gurukul}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-gurukul_dev}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-gurukul_ai}
    volumes:
      - mongodb_data:/data/db
    networks:
      - gurukul-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------
  # Redis — Cache & BullMQ Job Queue
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gurukul-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - gurukul-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------------------------
  # Backend — Express API Server
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: gurukul-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-gurukul}:${MONGO_ROOT_PASSWORD:-gurukul_dev}@mongodb:27017/${MONGO_DB_NAME:-gurukul_ai}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - backend_node_modules:/app/node_modules
    working_dir: /app
    command: npx tsx watch src/server.ts
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gurukul-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------
  # Frontend — Vite Dev Server
  # ------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: gurukul-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      VITE_API_URL: http://localhost/api
      VITE_SOCKET_URL: ws://localhost/socket.io
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: npx vite --host 0.0.0.0 --port 3000
    depends_on:
      - backend
    networks:
      - gurukul-network

  # ------------------------------------------
  # Nginx — Reverse Proxy
  # ------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: gurukul-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - gurukul-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# ------------------------------------------
# Shared Network
# ------------------------------------------
networks:
  gurukul-network:
    driver: bridge

# ------------------------------------------
# Persistent Volumes
# ------------------------------------------
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
