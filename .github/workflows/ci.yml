# Gurukul AI — Pull Request Checks
# Lightweight PR validation: lint + full test suite (unit, integration) + coverage enforcement
# This workflow runs on all PRs and enforces quality gates.
# Requirements: 9.3, 10.5

name: PR Checks

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────
  # Lint: ESLint, Prettier, TypeScript type checks
  # ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: ESLint (frontend)
        run: npm run lint

      - name: Prettier check (frontend)
        run: npm run format:check

      - name: TypeScript check (frontend)
        run: npm run type-check

      - name: TypeScript check (backend)
        run: npm run typecheck
        working-directory: backend

  # ─────────────────────────────────────────────────────────
  # Route Map Compliance (Requirement 1.3, 3.2, 3.4)
  # Regenerates the Route_Map and fails on duplicate routes
  # or missing-doc drift.
  # ─────────────────────────────────────────────────────────
  route-map-check:
    name: Route Map Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Check route map compliance
        run: npm run check:route-map
        working-directory: backend

  # ─────────────────────────────────────────────────────────
  # Frontend Tests with Coverage (80% threshold enforced)
  # ─────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests (Coverage ≥ 80%)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-pr
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Backend Tests with Coverage (80% threshold enforced)
  # ─────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Coverage ≥ 80%)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: backend
        env:
          CI: true
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/gurukul_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_key
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-pr
          path: backend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Build Verification (ensure project compiles cleanly)
  # ─────────────────────────────────────────────────────────
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, route-map-check]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install and build frontend
        run: |
          npm ci
          npm run build
        env:
          CI: false

      - name: Install and build backend
        run: |
          npm ci
          npm run build
        working-directory: backend

  # ─────────────────────────────────────────────────────────
  # Test Duration Warning (Requirement 9.7)
  # ─────────────────────────────────────────────────────────
  duration-check:
    name: Duration Warning
    runs-on: ubuntu-latest
    needs: [build-check]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check overall duration
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub Actions auto-reports timing. This step warns if the workflow
            // is configured to exceed 15 minutes (Requirement 9.7).
            const totalTimeout = 5 + 10 + 10 + 10; // sum of job timeouts
            if (totalTimeout > 15) {
              core.warning(`Total workflow timeout budget (${totalTimeout} min) exceeds 15-minute test duration budget. Consider optimization.`);
            }
            core.info('Pipeline duration check completed. See workflow summary for individual job times.');
