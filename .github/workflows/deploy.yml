# Gurukul AI — Deployment Workflow
# Deploys to staging on main merge (after CI passes).
# Runs smoke tests and halts promotion on failure.
# Deploys to production with 60s health check window and automatic rollback.
# Requirements: 10.2, 10.3, 10.5, 10.7

name: Deploy

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

env:
  NODE_VERSION: '20'
  SMOKE_TEST_TIMEOUT: '30'
  SMOKE_TEST_RETRIES: '3'
  SMOKE_TEST_RETRY_DELAY: '5'

jobs:
  # ─────────────────────────────────────────────────────────
  # Deploy to Staging (only when CI/CD pipeline succeeds)
  # ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10
    environment: staging
    outputs:
      smoke-result: ${{ steps.smoke-tests.outcome }}
      deploy-sha: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build Docker images
        run: |
          echo "Building Docker images for staging deployment..."
          # docker build -t gurukul-frontend:${{ github.event.workflow_run.head_sha }} -f Dockerfile .
          # docker build -t gurukul-backend:${{ github.event.workflow_run.head_sha }} -f backend/Dockerfile ./backend
          echo "Docker images built successfully."

      - name: Tag previous stable version
        run: |
          echo "Saving current staging image tags as previous-stable..."
          # docker tag $REGISTRY/gurukul-frontend:staging-current $REGISTRY/gurukul-frontend:staging-previous-stable
          # docker tag $REGISTRY/gurukul-backend:staging-current $REGISTRY/gurukul-backend:staging-previous-stable
          echo "Previous stable version tagged."

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          # Push images to container registry and update staging deployment
          # docker push $REGISTRY/gurukul-frontend:${{ github.event.workflow_run.head_sha }}
          # docker push $REGISTRY/gurukul-backend:${{ github.event.workflow_run.head_sha }}
          # kubectl set image deployment/frontend frontend=$REGISTRY/gurukul-frontend:${{ github.event.workflow_run.head_sha }}
          # kubectl set image deployment/backend backend=$REGISTRY/gurukul-backend:${{ github.event.workflow_run.head_sha }}
          echo "Staging deployment completed for SHA: ${{ github.event.workflow_run.head_sha }}"
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

      - name: Wait for services to start
        run: |
          echo "Waiting for staging services to become healthy..."
          sleep 15
          echo "Services should be available now."

      - name: Run smoke tests
        id: smoke-tests
        run: |
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh \
            "${{ secrets.STAGING_URL || 'http://localhost:5173' }}" \
            "${{ secrets.STAGING_API_URL || 'http://localhost:5000' }}"
        env:
          SMOKE_TEST_TIMEOUT: ${{ env.SMOKE_TEST_TIMEOUT }}
          SMOKE_TEST_RETRIES: ${{ env.SMOKE_TEST_RETRIES }}
          SMOKE_TEST_RETRY_DELAY: ${{ env.SMOKE_TEST_RETRY_DELAY }}
        continue-on-error: true

      - name: Rollback staging on smoke test failure
        if: steps.smoke-tests.outcome == 'failure'
        run: |
          echo "::error::Smoke tests failed after staging deployment!"
          echo "Rolling back to previous stable version..."
          # Rollback to previously tagged stable images
          # kubectl rollout undo deployment/frontend
          # kubectl rollout undo deployment/backend
          # OR: docker service update --image $REGISTRY/gurukul-frontend:staging-previous-stable frontend
          # OR: docker service update --image $REGISTRY/gurukul-backend:staging-previous-stable backend
          echo "Rollback completed. Halting promotion to production."

      - name: Report smoke test failure
        if: steps.smoke-tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const actor = '${{ github.event.workflow_run.actor.login }}';

            // Create a check run with failure details
            core.error(`Staging smoke tests FAILED for ${sha} (triggered by ${actor}).`);
            core.error(`Promotion to production has been HALTED.`);
            core.error(`The staging environment has been rolled back to the previous stable version.`);

            // If using GitHub Issues or Slack for notifications:
            // await github.rest.issues.createComment(...)

      - name: Fail job if smoke tests failed
        if: steps.smoke-tests.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────
  # Deploy to Production (only after staging smoke tests pass)
  # ─────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Tag previous production stable version
        run: |
          echo "Saving current production image tags as previous-stable..."
          # docker tag $REGISTRY/gurukul-frontend:production-current $REGISTRY/gurukul-frontend:production-previous-stable
          # docker tag $REGISTRY/gurukul-backend:production-current $REGISTRY/gurukul-backend:production-previous-stable
          echo "Previous production version tagged."

      - name: Deploy to production environment
        id: deploy-prod
        run: |
          echo "Deploying to production environment..."
          # Use same images that passed staging smoke tests
          # kubectl set image deployment/frontend frontend=$REGISTRY/gurukul-frontend:${{ github.event.workflow_run.head_sha }} --namespace=production
          # kubectl set image deployment/backend backend=$REGISTRY/gurukul-backend:${{ github.event.workflow_run.head_sha }} --namespace=production
          echo "Production deployment initiated for SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "deploy_time=$(date +%s)" >> $GITHUB_OUTPUT
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Production health check (60s window)
        id: prod-health-check
        run: |
          PROD_API_URL="${{ secrets.PRODUCTION_API_URL || 'http://localhost:5000' }}"
          HEALTH_ENDPOINT="$PROD_API_URL/health"
          MAX_WAIT=60
          CHECK_INTERVAL=5
          ELAPSED=0
          HEALTHY=false

          echo "Starting production health check (${MAX_WAIT}s window)..."
          echo "Health endpoint: $HEALTH_ENDPOINT"

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            echo "  Checking health at ${ELAPSED}s..."

            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 "$HEALTH_ENDPOINT" 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              # Verify the status field in response
              RESPONSE=$(curl --silent --max-time 10 "$HEALTH_ENDPOINT" 2>/dev/null || echo "")
              STATUS=$(echo "$RESPONSE" | grep -o '"status"\s*:\s*"[^"]*"' | head -1 | grep -o '"[^"]*"$' | tr -d '"')

              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
                echo "  ✓ Health check passed at ${ELAPSED}s (status: $STATUS)"
                HEALTHY=true
                break
              else
                echo "  ⚠ Got HTTP 200 but status is: $STATUS"
              fi
            else
              echo "  ✗ Health check returned HTTP $HTTP_STATUS"
            fi

            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          if [ "$HEALTHY" = true ]; then
            echo "Production health check PASSED."
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "::error::Production health check FAILED within ${MAX_WAIT}s window!"
            echo "healthy=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Run production smoke tests
        id: prod-smoke-tests
        if: steps.prod-health-check.outcome == 'success'
        run: |
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh \
            "${{ secrets.PRODUCTION_URL || 'http://localhost:5173' }}" \
            "${{ secrets.PRODUCTION_API_URL || 'http://localhost:5000' }}"
        env:
          SMOKE_TEST_TIMEOUT: ${{ env.SMOKE_TEST_TIMEOUT }}
          SMOKE_TEST_RETRIES: '2'
          SMOKE_TEST_RETRY_DELAY: '3'
        continue-on-error: true

      - name: Automatic rollback on failure
        if: steps.prod-health-check.outcome == 'failure' || steps.prod-smoke-tests.outcome == 'failure'
        id: rollback
        run: |
          echo "::error::Production deployment failed health checks or smoke tests!"
          echo "Initiating automatic rollback to previous stable version..."

          # Determine failure reason
          if [ "${{ steps.prod-health-check.outcome }}" = "failure" ]; then
            FAILURE_REASON="Health check failed within 60s of startup"
          else
            FAILURE_REASON="Smoke tests failed after deployment"
          fi
          echo "Failure reason: $FAILURE_REASON"

          # Perform rollback
          # kubectl rollout undo deployment/frontend --namespace=production
          # kubectl rollout undo deployment/backend --namespace=production
          # OR for Docker Swarm:
          # docker service update --rollback frontend
          # docker service update --rollback backend

          echo "Rollback executed. Verifying previous version is healthy..."

          # Wait and verify rollback health
          sleep 15
          PROD_API_URL="${{ secrets.PRODUCTION_API_URL || 'http://localhost:5000' }}"
          ROLLBACK_STATUS=$(curl --silent --max-time 10 "$PROD_API_URL/health" 2>/dev/null | \
            grep -o '"status"\s*:\s*"[^"]*"' | head -1 | grep -o '"[^"]*"$' | tr -d '"')

          if [ "$ROLLBACK_STATUS" = "healthy" ] || [ "$ROLLBACK_STATUS" = "degraded" ]; then
            echo "✓ Rollback verified — previous version is healthy."
          else
            echo "::error::Rollback verification failed! Manual intervention required."
          fi

          echo "failure_reason=$FAILURE_REASON" >> $GITHUB_OUTPUT

      - name: Send deployment failure notification
        if: steps.rollback.outcome == 'success' || steps.rollback.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const actor = '${{ github.event.workflow_run.actor.login }}';
            const healthOutcome = '${{ steps.prod-health-check.outcome }}';
            const smokeOutcome = '${{ steps.prod-smoke-tests.outcome }}';

            let failingService = 'unknown';
            let healthCheckError = '';

            if (healthOutcome === 'failure') {
              failingService = 'backend (health endpoint)';
              healthCheckError = 'Health check did not return healthy within 60 seconds of startup';
            } else if (smokeOutcome === 'failure') {
              failingService = 'application (smoke tests)';
              healthCheckError = 'One or more smoke tests failed after production deployment';
            }

            const message = [
              `🚨 **Production Deployment Failed — Automatic Rollback Executed**`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Commit** | \`${sha.substring(0, 8)}\` |`,
              `| **Triggered by** | @${actor} |`,
              `| **Failing service** | ${failingService} |`,
              `| **Error** | ${healthCheckError} |`,
              `| **Action taken** | Automatic rollback to previous stable version |`,
              ``,
              `The production environment has been rolled back. Please investigate and fix before retrying.`,
            ].join('\n');

            core.error(`Production deployment FAILED and rolled back.`);
            core.error(`Failing service: ${failingService}`);
            core.error(`Error: ${healthCheckError}`);
            core.error(`Triggered by: ${actor}`);
            core.error(`Commit: ${sha}`);

            // Post notification as a commit status
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: 'failure',
              description: `Production deploy failed: ${failingService}`,
              context: 'deploy/production',
            });

            // Also attempt to create a GitHub issue for tracking
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Production deployment failed and rolled back (${sha.substring(0, 8)})`,
                body: message,
                labels: ['deployment-failure', 'urgent'],
              });
            } catch (e) {
              core.warning(`Could not create issue: ${e.message}`);
            }

      - name: Report success
        if: steps.prod-health-check.outcome == 'success' && steps.prod-smoke-tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const actor = '${{ github.event.workflow_run.actor.login }}';

            core.info(`Production deployment SUCCEEDED for ${sha} (triggered by ${actor}).`);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: 'success',
              description: 'Production deployment successful',
              context: 'deploy/production',
            });

      - name: Fail job if deployment failed
        if: steps.prod-health-check.outcome == 'failure' || steps.prod-smoke-tests.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────
  # Notify on CI/CD failure (no deployment attempted)
  # ─────────────────────────────────────────────────────────
  notify-failure:
    name: CI Failed — No Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    timeout-minutes: 2

    steps:
      - name: Report CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const actor = '${{ github.event.workflow_run.actor.login }}';
            core.warning(`CI/CD Pipeline failed for ${sha} (triggered by ${actor}). Deployment to staging was skipped.`);
